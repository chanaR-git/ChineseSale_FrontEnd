<p-toast></p-toast>

<div class="admin-page-wrapper p-3 md:p-5" dir="rtl">

    <div class="flex flex-column md:flex-row justify-content-between align-items-center mb-4 gap-3">
        <div>
            <h2 class="text-3xl md:text-4xl font-bold m-0" style="color: var(--primary-color);">ניהול מלאי מתנות</h2>
            <p class="text-secondary mt-1 hidden md:block">ממשק ניהול חכם למכירה הסינית של "זה לזה"</p>
        </div>
        <p-button icon="pi pi-plus" label="הוספת מתנה חדשה" (onClick)="openAddGiftForm($event)"
            styleClass="btn-accent-zlz shadow-2 w-full md:w-auto"></p-button>
    </div>

    <p-card styleClass="mb-4 shadow-1 border-none border-right-3 border-gold">
        <form [formGroup]="searchForm" class="grid grid-nogutter align-items-end gap-3">
            <div class="field col-12 md:col-3 mb-0">
                <label class="block text-sm font-bold mb-2 text-700">שם מתנה</label>
                <input pInputText formControlName="name" placeholder="חיפוש לפי שם..." class="w-full" />
            </div>

            <div class="field col-12 md:col-3 mb-0">
                <label class="block text-sm font-bold mb-2 text-700">תורם</label>
                <p-autocomplete formControlName="donor" [suggestions]="filteredDonors"
                    (completeMethod)="filterDonors($event)" field="name" optionLabel="name" [dropdown]="true"
                    placeholder="בחר תורם..." styleClass="w-full" inputStyleClass="w-full" (onClear)="loadGifts()">
                </p-autocomplete>
            </div>

            <div class="field col-12 md:col-2 mb-0">
                <label class="block text-sm font-bold mb-2 text-700">רוכשים</label>
                <input pInputText type="number" formControlName="minBuyers" placeholder="0" class="w-full" />
            </div>

            <div class="col-12 md:col-2 flex align-items-end">
                <p-button label="נקה" icon="pi pi-filter-slash" styleClass="p-button-text p-button-secondary w-full"
                    (onClick)="resetFilters()">
                </p-button>
            </div>
        </form>
    </p-card>

    <div class="table-container shadow-3 border-round-xl bg-white overflow-hidden">
        <p-table [value]="gifts" [paginator]="true" [rows]="10" [scrollable]="true" scrollDirection="horizontal"
            styleClass="p-datatable-sm custom-table">
            <ng-template #header>
                <tr>
                    <th style="min-width: 80px">קוד</th>
                    <th style="min-width: 150px">שם המתנה</th>
                    <th style="min-width: 250px">תיאור</th>
                    <th style="min-width: 130px">קטגוריה</th>
                    <th style="min-width: 130px">תורם</th>
                    <th style="min-width: 100px">מחיר</th>
                    <th style="min-width: 100px">תמונה</th>
                    <th style="min-width: 80px" class="text-center">עריכה</th>
                </tr>
            </ng-template>
            <ng-template #body let-gift>
                <tr>
                    <td>{{ gift.id }}</td>
                    <td class="text-purple-zlz font-bold">{{ gift.name }}</td>
                    <td>
                        <div class="description-cell">{{ gift.description }}</div>
                    </td>
                    <td class="text-purple-zlz">{{ gift.categoryName }}</td>
                    <td>{{ gift.donorName }}</td>
                    <td class="font-bold text-gold">₪{{ gift.price }}</td>
                    <td class="text-center">
                        <img [src]=" gift.imagePath" width="45" class="shadow-1 border-round border-1 border-200">
                    </td>
                    <td class="text-center">
                        <p-button (onClick)="displayGift($event, gift)" icon="pi pi-pencil"
                            styleClass="p-button-rounded p-button-text p-button-secondary"></p-button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
<p-popover #addGiftPopover (onHide)="closeAddGiftForm()" [style]="{'width': '90vw', 'max-width': '350px'}">
    <ng-template #content>
        <div class="p-2">
            <h3 class="text-lg font-bold mb-3 text-purple-zlz">הוספת מתנה</h3>
            <form [formGroup]="addGiftForm" class="flex flex-column gap-2"> <input pInputText formControlName="name"
                    placeholder="שם מתנה *" class="p-inputtext-sm" />
                <input pInputText formControlName="description" placeholder="תיאור *" class="p-inputtext-sm" />

                <p-autocomplete [formControl]="categoryDisplayControl" [dropdown]="true" field="name" optionLabel="name"
                    [suggestions]="filteredCategories" (completeMethod)="filterCategories($event)"
                    (onSelect)="onCategorySelect($event)" placeholder="בחר קטגוריה *"
                    styleClass="w-full p-inputtext-sm">
                </p-autocomplete>

                <p-autocomplete [formControl]="donorDisplayControl" [dropdown]="true" field="name" optionLabel="name"
                    [suggestions]="filteredDonors" (completeMethod)="filterDonors($event)"
                    (onSelect)="onDonorSelect($event)" placeholder="בחר תורם *" styleClass="w-full p-inputtext-sm">
                </p-autocomplete>

                <input pInputText formControlName="price" type="number" placeholder="מחיר *" class="p-inputtext-sm" />
                <input pInputText formControlName="imagePath" placeholder="נתיב תמונה *" class="p-inputtext-sm" />

                <div class="flex gap-2 mt-2">
                    <p-button label="שמור" (onClick)="addGift()" [disabled]="!addGiftForm.valid" class="flex-grow-1"
                        styleClass="btn-accent-zlz p-button-sm"></p-button>
                    <p-button icon="pi pi-times" severity="secondary" outlined (onClick)="closeAddGiftForm()"
                        styleClass="p-button-sm"></p-button>
                </div>
            </form>
        </div>
    </ng-template>
</p-popover>

<p-popover #op (onHide)="selectedGift = null" [style]="{'width': '90vw', 'max-width': '350px'}">
    <ng-template #content>
        <div *ngIf="selectedGift" class="p-2">
            <h3 class="text-purple-zlz">עריכת מתנה</h3>
            <form [formGroup]="updateGiftForm" class="flex flex-column gap-2">
                <input pInputText formControlName="name" placeholder="שם" class="p-inputtext-sm" />
                <input pInputText formControlName="description" placeholder="תיאור" class="p-inputtext-sm" />

                <p-autocomplete [formControl]="categoryDisplayControl" [dropdown]="true" field="name" optionLabel="name"
                    [suggestions]="filteredCategories" (completeMethod)="filterCategories($event)"
                    (onSelect)="onCategorySelect($event)" placeholder="עדכן קטגוריה" styleClass="w-full p-inputtext-sm">
                </p-autocomplete>

                <input pInputText formControlName="price" placeholder="מחיר" class="p-inputtext-sm" />
                <input pInputText formControlName="imagePath" placeholder="נתיב תמונה" class="p-inputtext-sm" />

                <div class="flex gap-2 mt-3 pt-2 border-top-1 border-100">
                    <p-button label="עדכן " (onClick)="updateGift()" class="flex-grow-1"
                        styleClass="p-button-primary" [disabled]="!updateGiftForm.valid">
                    </p-button>
                    <p-button icon="pi pi-trash" severity="danger" outlined (onClick)="deleteGift()"
                        styleClass="p-button-sm"></p-button>
                </div>
            </form>
        </div>
    </ng-template>
</p-popover>
