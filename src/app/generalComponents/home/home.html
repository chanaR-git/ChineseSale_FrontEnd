<div class="home-container" dir="rtl">
  <div class="hero-overlay"></div>

  <div class="content-wrapper">
    <div class="hero-text">
      <h1 class="main-title">הגרלה סינית חגיגית</h1>
      <h2 class="sub-title">ארגון "זה לזה"</h2>
      <div class="gold-divider"></div>
      <p class="description">
        הזדמנות פז לזכות במתנות יוקרה ולקחת חלק בנתינה גדולה. 
        הצטרפו עכשיו למכירה הסינית הגדולה של השנה!
      </p>
    </div>

    <div class="actions">
      <button class="cta-button pulse-animation" (click)="goToGifts()">
        <span class="btn-content">
          <i class="pi pi-ticket"></i>
          לרכישת כרטיסים עכשיו
        </span>
      </button>
    </div>

    <div class="floating-icons">
      <i class="pi pi-gift float-item icon-1"></i>
      <i class="pi pi-star-fill float-item icon-2"></i>
      <i class="pi pi-shopping-bag float-item icon-3"></i>
    </div>
  </div>
</div>
