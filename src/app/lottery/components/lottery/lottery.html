<div class="admin-container p-4 md:p-6" dir="rtl">
  
  <div class="text-center mb-6">
    <h2 class="text-5xl font-bold m-0" style="color: var(--primary-color); letter-spacing: -1px;">
      מערכת ההגרלות המרכזית
    </h2>
    <div class="gold-underline mx-auto mt-2"></div>
  </div>

  <div class="grid justify-content-center">
    <div class="col-12">
      <p-card styleClass="main-lottery-card shadow-8 overflow-hidden border-none">
        <div class="grid grid-nogutter">
          <div class="col-12 md:col-4 flex align-items-center justify-content-center p-4 gold-bg-section">
            <i class="pi pi-star-fill bounce-animation" style="font-size: 8rem; color: white;"></i>
          </div>
          
          <div class="col-12 md:col-8 p-5 flex flex-column justify-content-center text-center md:text-right">
            <span class="text-gold font-bold text-xl mb-2 block">רגע השיא הגיע!</span>
            <h1 class="m-0 text-4xl font-black mb-3" style="color: var(--primary-color);">הגרלה סינית "זה לזה"</h1>
            <p class="text-700 line-height-3 mb-5 text-xl">בדיוק עכשיו, אלפי תומכים מחכים לדעת מי הזוכים המאושרים. לחץ על הכפתור והפעל את הקסם!</p>
            
            <div class="flex flex-column align-items-center md:align-items-start gap-3">
              <button pButton pRipple 
                      (click)="runAllLotteries()" 
                      [disabled]="afterLottery"
                      class="lottery-btn-massive shadow-6"
                      [label]="afterLottery ? 'ההגרלה הסתיימה' : 'הגרל את כל המתנות עכשיו!'"
                      [icon]="afterLottery ? 'pi pi-check-circle' : 'pi pi-bolt'">
              </button>

              <button pButton pRipple 
                      (click)="downloadWinners()" 
                      class="p-button-text p-button-sm mt-2 font-bold gold-link"
                      label="להורדת דוח זוכים המלא (ZIP)"
                      icon="pi pi-file-export">
              </button>
            </div>
          </div>
        </div>
      </p-card>
    </div>
  </div>

  <div class="flex justify-content-end mt-4">
     <button pButton (click)="resetSale()" 
             class="p-button-danger p-button-text p-button-sm opacity-60 hover:opacity-100" 
             label="איפוס מערכת" icon="pi pi-refresh"></button>
  </div>

  <div class="status-section mt-6" *ngIf="winners.length > 0">
    <div class="winners-grid grid">
        <div *ngFor="let w of winners" class="col-12 md:col-6 lg:col-4 p-2">
            <div class="winner-item-card p-3 shadow-2 flex align-items-center border-round-xl bg-white border-right-3 border-gold">
                <div class="winner-icon ml-3">🏆</div>
                <span class="font-bold text-800">{{ w }}</span>
            </div>
        </div>
    </div>
  </div>
</div>

<div id="confetti-canvas"></div>
