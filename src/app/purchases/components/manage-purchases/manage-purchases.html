<p-toast></p-toast>

<div class="card">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">ניהול רכישות</h2>
    <div class="flex gap-2">
      <p-button 
        label="מיון לפי מחיר" 
        icon="pi pi-sort-amount-down" 
        (onClick)="sortByPrice()"
        severity="secondary"
        [outlined]="true"
      ></p-button>
      <p-button 
        icon="pi pi-refresh" 
        (onClick)="loadPurchases()" 
        [loading]="loading"
        severity="info"
      ></p-button>
    </div>
  </div>

  <p-table 
    [value]="purchases" 
    [tableStyle]="{ 'min-width': '60rem' }" 
    [paginator]="true" 
    [rows]="10"
    [loading]="loading"
    styleClass="p-datatable-striped"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="id">קוד רכישה <p-sortIcon field="id"></p-sortIcon></th>
        <th pSortableColumn="customerName">שם לקוח <p-sortIcon field="customerName"></p-sortIcon></th>
        <th>אימייל</th>
        <th pSortableColumn="giftName">מתנה <p-sortIcon field="giftName"></p-sortIcon></th>
        <th pSortableColumn="giftPrice">מחיר <p-sortIcon field="giftPrice"></p-sortIcon></th>
        <th pSortableColumn="purchDate">תאריך רכישה <p-sortIcon field="purchDate"></p-sortIcon></th>
      </tr>
    </ng-template>
    
    <ng-template #body let-purchase>
      <tr>
        <td>{{ purchase.id }}</td>
        <td>{{ purchase.customerName }}</td>
        <td>{{ purchase.customerEmail }}</td>
        <td>
          <p-tag [value]="purchase.giftName" severity="info"></p-tag>
        </td>
        <td class="font-bold">{{ purchase.giftPrice | currency:'ILS' }}</td>
        <td>{{ purchase.purchDate | date:'dd/MM/yyyy HH:mm' }}</td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="text-center p-4">לא נמצאו רכישות במערכת.</td>
      </tr>
    </ng-template>
  </p-table>
</div>>
