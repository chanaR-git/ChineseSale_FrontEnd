<p>manage-donors works!</p>
<p-toast></p-toast>

<div class="card">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">Manage Donors</h2>
    <p-button 
      icon="pi pi-plus" 
      label="Add Donor" 
      (onClick)="openAddDonorForm($event)"
      severity="success"
    ></p-button>
  </div>

  <p-table [value]="donors" [tableStyle]="{ 'min-width': '50rem' }" [paginator]="true" [rows]="5">
    <ng-template #header>
      <tr>
        <th class="w-1/6">תז</th>
        <th class="w-1/6">שם</th>
        <th class="w-1/6">מייל</th>
        <th class="w-1/6">טלפון</th>
        <th class="w-1/6">עריכה</th>
      </tr>
    </ng-template>
    <ng-template #body let-donor>
      <tr>
        <td>{{ donor.id }}</td>
        <td>{{ donor.name }}</td>
        <td>{{ donor.email }}</td>
        <td>{{ donor.phone }}</td>
        <td>
          <p-button (onClick)="displayDonor($event, donor)" icon="pi pi-search" severity="secondary" rounded />
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Add Donor Popover -->
  <p-popover #addDonorPopover (onHide)="closeAddDonorForm()">
    <ng-template #content>
      <div class="rounded flex flex-col gap-4 w-80">
        <h3 class="font-bold text-lg">הוספת תורם</h3>
        <form [formGroup]="addDonorForm" class="space-y-3">
          <div>
            <label class="block text-sm font-semibold mb-1">שם *</label>
            <input
              pInputText
              type="text"
              formControlName="name"
              class="w-full"
              placeholder="Enter name"
            />
            <small class="text-red-500" *ngIf="addDonorForm.get('name')?.invalid && addDonorForm.get('name')?.touched">
              שם הוא שדה חובה (עד 50 תווים)
            </small>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Email *</label>
            <input
              pInputText
              type="email"
              formControlName="email"
              class="w-full"
              placeholder="Enter email"
            />
            <small class="text-red-500" *ngIf="addDonorForm.get('email')?.invalid && addDonorForm.get('email')?.touched">
              Valid email is required
            </small>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Phone *</label>
            <input
              pInputText
              type="text"
              formControlName="phone"
              class="w-full"
              placeholder="Enter 10-digit phone"
              maxlength="10"
            />
            <small class="text-red-500" *ngIf="addDonorForm.get('phone')?.invalid && addDonorForm.get('phone')?.touched">
              Phone must be 10 digits
            </small>
          </div>
        </form>
        <div class="flex gap-2 pt-2">
          <p-button
            icon="pi pi-check"
            label="Add"
            class="flex-auto"
            (onClick)="addDonor()"
            [disabled]="!addDonorForm.valid"
          />
          <p-button
            icon="pi pi-times"
            severity="secondary"
            outlined
            (onClick)="closeAddDonorForm()"
          />
        </div>
      </div>
    </ng-template>
  </p-popover>

  <!-- Edit/Delete Donor Popover -->
  <p-popover #op (onHide)="selectedDonor = null">
    <ng-template #content>
      <div *ngIf="selectedDonor" class="rounded flex flex-col gap-4 w-80">
        <h3 class="font-bold text-lg">Edit Donor</h3>
        <form [formGroup]="donorForm" class="space-y-3">
          <div>
            <label class="block text-sm font-semibold mb-1">Name</label>
            <input
              pInputText
              type="text"
              formControlName="name"
              class="w-full"
              [placeholder]="selectedDonor.name"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Email</label>
            <input
              pInputText
              type="email"
              formControlName="email"
              class="w-full"
              [placeholder]="selectedDonor.email"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Phone</label>
            <input
              pInputText
              type="text"
              formControlName="phone"
              class="w-full"
              [placeholder]="selectedDonor.phone"
              maxlength="10"
            />
          </div>

          <div class="flex justify-between">
            <span class="text-surface-500 dark:text-surface-400">ID:</span>
            <span class="font-medium">{{ selectedDonor.id }}</span>
          </div>
        </form>
        <div class="flex gap-2 pt-2">
          <p-button
            icon="pi pi-pencil"
            label="Update"
            class="flex-auto"
            styleClass="w-full"
            (onClick)="updateDonor()"
          />
          <p-button icon="pi pi-trash" severity="danger" outlined (onClick)="deleteDonor()" />
        </div>
      </div>
    </ng-template>
  </p-popover>
</div>
