<p>manage-donors works!</p>
<div class="card">
    <p-table [value]="donors" [tableStyle]="{ 'min-width': '50rem' }" [paginator]="true" [rows]="5">
        <ng-template #header>
            <tr>
                <th class="w-1/6">Id</th>
                <th class="w-1/6">Name</th>
                <th class="w-1/6">Email</th>
                <th class="w-1/6">Phone</th>
                <th class="w-1/6">Actions</th>
            </tr>
        </ng-template>
        <ng-template #body let-donor>
            <tr>
                <td>{{ donor.id }}</td>
                <td>{{ donor.name }}</td>
                <td>{{ donor.email }}</td>
                <td>{{ donor.phone }}</td>
                <td>
                    <p-button (onClick)="displayDonor($event, donor)" icon="pi pi-search" severity="secondary" rounded />
                </td>
            </tr>
        </ng-template>
    </p-table>
    <p-popover #op (onHide)="selectedDonor = null">
        <ng-template #content>
            <div *ngIf="selectedDonor" class="rounded flex flex-col gap-4 w-80">
                <form [formGroup] = "donorForm" class="pt-2">
                     <input
                        pInputText
                        type="text"
                        formControlName="name"
                        class="w-full mb-2"
                        [readonly]="false"
                        [value]="selectedDonor.name"
                        [placeholder]="selectedDonor.name" />

                    <div class="space-y-2">
                        <div class="flex justify-between">
                            <input
                                pInputText
                                type="email"
                                formControlName="email"
                                class="w-full mb-2"
                                [readonly]="false"
                                [value]="selectedDonor.email"
                                [placeholder]="selectedDonor.email" />
                        </div>
                        <div class="flex justify-between">
                            <input
                                pInputText
                                type="text"
                                formControlName="phone"
                                class="w-full mb-2"
                                [readonly]="false"
                                [value]="selectedDonor.phone"
                                [placeholder]="selectedDonor.phone" />
                        </div>
                        <div class="flex justify-between">
                            <span class="text-surface-500 dark:text-surface-400">ID:</span>
                            <span class="font-medium">{{ selectedDonor.id }}</span>
                        </div>
                    </div>
                </form>
                <div class="flex gap-2 pt-2">
                    <p-button
                        icon="pi pi-pencil"
                        label="Edit"
                        class="flex-auto"
                        styleClass="w-full"
                        (onClick)="hidePopover()"
                    />
                    <p-button icon="pi pi-trash" severity="danger" outlined (onClick)="hidePopover()" />
                </div>
            </div>
        </ng-template>
    </p-popover>
</div>
